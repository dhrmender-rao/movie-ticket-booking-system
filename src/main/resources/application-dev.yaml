spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/movieticket
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: dev-pool
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: update          # auto-creates / updates schema on startup
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# ── Dev-only app overrides ─────────────────────────────────────
app:
  payment:
    always-succeed: false       # flip to true to skip simulated failures locally

